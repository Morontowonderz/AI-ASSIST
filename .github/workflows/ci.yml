name: v1-runner
on:
  push:
    branches: [main]
  pull_request:
jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest tests/test_runner_regression.py -q --tb=short
